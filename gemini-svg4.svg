<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <style>
      .bg-lens { fill: #F7F5EF; }
      .brand-title-lens { font-family: 'Cinzel', 'Baskerville', 'Georgia', serif; font-weight: 500; font-size: 26px; fill: #1D1B20; letter-spacing: 0.32em; }
      .brand-sub-lens { font-family: 'Inter', -apple-system, sans-serif; font-weight: 300; font-size: 10px; fill: #6B5B3E; letter-spacing: 0.28em; }
    </style>
    <!-- Rich Translucent Palette -->
    <linearGradient id="purpleLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E5D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2E1C3B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldLens" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#AA7C11" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sageLens" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B6658" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2C4436" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="bg-lens" width="800" height="520" />

  <!-- Mark: The Luminous Overlap -->
  <g transform="translate(400, 195)">
    <!-- Primary Overlapping Petal/Lens Planes -->
    <path d="M 0,-75 C 45,-75 75,-35 75,0 C 35,35 -35,35 -75,0 C -75,-35 -45,-75 0,-75 Z" fill="url(#purpleLens)"/>
    <path d="M -65,35 C -35,-45 25,-65 65,-25 C 65,25 25,75 -25,65 C -55,55 -65,10 -65,35 Z" fill="url(#goldLens)"/>
    <path d="M 65,35 C 35,-45 -25,-65 -65,-25 C -65,25 -25,75 25,65 C 55,55 65,10 65,35 Z" fill="url(#sageLens)"/>

    <!-- Emergent Core Geometry (Hidden Structure Revealed) -->
    <polygon points="0,-22 19,11 -19,11" fill="#F7F5EF" opacity="0.9"/>
    <polygon points="0,22 -19,-11 19,-11" fill="#D4AF37" opacity="0.75"/>
    <circle cx="0" cy="0" r="4" fill="#2E1C3B"/>
  </g>

  <!-- Brand Lockup -->
  <text x="400" y="360" class="brand-title-lens" text-anchor="middle">ALETHEIA EMERGENCE</text>
  <text x="400" y="395" class="brand-sub-lens" text-anchor="middle">WHERE INTELLIGENCE CONVERGES, CREATION COALESCES</text>
</svg>
