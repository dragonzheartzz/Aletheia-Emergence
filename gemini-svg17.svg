<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <style>
      .bg-17 { fill: #F5F2EC; }
      .title-17 { font-family: 'Cinzel', 'Baskerville', serif; font-weight: 500; font-size: 26px; fill: #1C1917; letter-spacing: 0.36em; }
      .sub-17 { font-family: 'Inter', -apple-system, sans-serif; font-weight: 300; font-size: 10px; fill: #3D5A45; letter-spacing: 0.3em; }
    </style>

    <linearGradient id="purplePlane17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58316B"/>
      <stop offset="100%" stop-color="#281333"/>
    </linearGradient>

    <linearGradient id="goldPlane17" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#93701E"/>
    </linearGradient>

    <linearGradient id="sagePlane17" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#416353"/>
      <stop offset="100%" stop-color="#1E332A"/>
    </linearGradient>
  </defs>

  <!-- Warm Alabaster Canvas -->
  <rect class="bg-17" width="800" height="560" />

  <!-- Integrated Crest Symbol -->
  <g transform="translate(400, 200)">
    <!-- Base Foundation: Sage Plane -->
    <path d="M 0,-115 C 45,-80 85,-30 85,25 C 85,85 40,115 0,125 C -40,115 -85,85 -85,25 C -85,-30 -45,-80 0,-115 Z" fill="url(#sagePlane17)" opacity="0.85" />

    <!-- Mid Layer: Amethyst Shield Wing -->
    <path d="M -95,-15 C -50,-85 0,-25 0,-25 C 0,-25 50,-85 95,-15 C 68,48 0,95 0,95 C 0,95 -68,48 -95,-15 Z" fill="url(#purplePlane17)" opacity="0.92" />

    <!-- Top Core Layer: Gold Synthesis Crown -->
    <path d="M -52,-25 C -22,-65 0,-12 0,-12 C 0,-12 22,-65 52,-25 C 36,28 0,60 0,60 C 0,60 -36,28 -52,-25 Z" fill="url(#goldPlane17)" />

    <!-- Focal Aperture (The Disclosed Core / Truth Axis) -->
    <ellipse cx="0" cy="0" rx="15" ry="26" fill="#F5F2EC" />
    <ellipse cx="0" cy="0" rx="7" ry="14" fill="#1C1917" />
    <circle cx="0" cy="0" r="3" fill="#E5C158" />

    <!-- Precision Tension Guides -->
    <line x1="0" y1="-125" x2="0" y2="-115" stroke="#93701E" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="125" x2="0" y2="135" stroke="#93701E" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography Lockup -->
  <text x="400" y="375" class="title-17" text-anchor="middle">ALETHEIA EMERGENCE</text>
  <text x="400" y="410" class="sub-17" text-anchor="middle">WHERE INTELLIGENCE CONVERGES, CREATION COALESCES</text>
</svg>
