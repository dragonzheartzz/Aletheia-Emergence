<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .bg-a { fill: #F4F3EE; }
      .text-a { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 26px; fill: #1A1A18; letter-spacing: 0.15em; }
      .text-a-sub { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #66645E; letter-spacing: 0.1em; }
      .path-light { fill: none; stroke: #1A1A18; stroke-linecap: round; }
    </style>
  </defs>
  <rect class="bg-a" width="800" height="500" />
  
  <!-- The Many: Asymmetrical Origins -->
  <path class="path-light" stroke-width="1.5" d="M 120 180 Q 250 280 400 280" />
  <path class="path-light" stroke-width="3" d="M 80 260 Q 220 280 400 280" />
  <path class="path-light" stroke-width="6" d="M 220 380 Q 300 280 400 280" />
  
  <!-- The Coalescence: A Single Foundation -->
  <line x1="400" y1="280" x2="680" y2="280" stroke="#1A1A18" stroke-width="6" stroke-linecap="round"/>
  
  <!-- The Emergence: Typography built on the convergence -->
  <text x="415" y="260" class="text-a">ALETHEIA</text>
  <text x="418" y="310" class="text-a-sub">EMERGENCE</text>
</svg>
