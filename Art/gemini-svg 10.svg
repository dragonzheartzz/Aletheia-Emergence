<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <style>
      .bg-rel { fill: #ECE8E1; }
      .title-rel { font-family: 'Cinzel', 'Georgia', serif; font-weight: 400; font-size: 24px; fill: #22201D; letter-spacing: 0.38em; }
      .sub-rel { font-family: 'Inter', -apple-system, sans-serif; font-weight: 300; font-size: 10px; fill: #4A5E50; letter-spacing: 0.28em; }
      .sculpt-solid { fill: #22201D; }
      .sculpt-organic { fill: #4A354F; }
      .tension-line { stroke: #C5A059; stroke-width: 1.5; stroke-linecap: round; }
    </style>
    <linearGradient id="organicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C4266"/>
      <stop offset="100%" stop-color="#322038"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="bg-rel" width="800" height="520" />

  <!-- The Relational Spatial Composition -->
  <g transform="translate(400, 190)">
    <!-- Left Form: Rigid, Precise Geometric Anchor -->
    <path class="sculpt-solid" d="M -180,-70 L -45,-70 L -65,70 L -180,70 Z" />
    
    <!-- Right Form: Sculpted, Fluid Organic Body -->
    <path fill="url(#organicGrad)" d="M 45,-70 C 110,-70 170,-30 170,10 C 170,50 110,70 65,70 C 45,70 40,30 40,-10 C 40,-40 45,-70 45,-70 Z" />

    <!-- Active Negative Space Gap & Tension Bridge -->
    <!-- Vector 1: Upper Relational Guide -->
    <line class="tension-line" x1="-42" y1="-40" x2="43" y2="-40" opacity="0.6"/>
    <!-- Vector 2: Focal Tension Axis -->
    <line class="tension-line" x1="-50" y1="0" x2="40" y2="0" stroke-width="2.5"/>
    <circle cx="-5" cy="0" r="3.5" fill="#C5A059"/>
    <!-- Vector 3: Lower Relational Guide -->
    <line class="tension-line" x1="-58" y1="40" x2="52" y2="40" opacity="0.6"/>

    <!-- Subtle Grounding Field Lines -->
    <line x1="-220" y1="100" x2="220" y2="100" stroke="#4A5E50" stroke-width="0.75" opacity="0.4"/>
  </g>

  <!-- Integrated Editorial Typography -->
  <text x="400" y="355" class="title-rel" text-anchor="middle">ALETHEIA EMERGENCE</text>
  <text x="400" y="390" class="sub-rel" text-anchor="middle">WHERE INTELLIGENCE CONVERGES, CREATION COALESCES</text>
</svg>
