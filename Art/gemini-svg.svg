<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .bg-c { fill: #FFFFFF; }
      .text-c { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 24px; fill: #111111; letter-spacing: -0.02em; }
      .text-c-sub { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 24px; fill: #888888; letter-spacing: -0.02em; }
    </style>
  </defs>
  <rect class="bg-c" width="800" height="500" />
  
  <!-- The Process: Condensation and Coalescence -->
  <rect x="200" y="210" width="1" height="80" fill="#111111" opacity="0.2"/>
  <rect x="220" y="210" width="3" height="80" fill="#111111" opacity="0.4"/>
  <rect x="250" y="210" width="8" height="80" fill="#111111" opacity="0.6"/>
  <rect x="290" y="210" width="20" height="80" fill="#111111" opacity="0.85"/>
  <rect x="340" y="210" width="50" height="80" fill="#111111" opacity="1.0"/>
  
  <!-- Typography aligned to the final coalesced block -->
  <text x="420" y="260" class="text-c">ALETHEIA <tspan class="text-c-sub">EMERGENCE</tspan></text>
</svg>
