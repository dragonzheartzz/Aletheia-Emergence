<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <style>
      .bg-thresh { fill: #EFECE6; }
      .title-main { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 32px; letter-spacing: 0.25em; }
      .sub-thresh { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 10px; fill: #4B6658; letter-spacing: 0.3em; }
    </style>
    <clipPath id="clipLeft">
      <rect x="180" y="100" width="140" height="220" />
    </clipPath>
    <clipPath id="clipMid">
      <rect x="330" y="100" width="140" height="220" />
    </clipPath>
    <clipPath id="clipRight">
      <rect x="480" y="100" width="140" height="220" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect class="bg-thresh" width="800" height="520" />

  <!-- The Three Architectural Chromatic Thresholds -->
  <g transform="translate(0, 20)">
    <!-- Block 1: Imperial Amethyst -->
    <rect x="180" y="110" width="140" height="200" rx="4" fill="#3B2348" />
    <!-- Block 2: Burnished Gold -->
    <rect x="330" y="110" width="140" height="200" rx="4" fill="#C59B27" />
    <!-- Block 3: Forest Sage -->
    <rect x="480" y="110" width="140" height="200" rx="4" fill="#3D5245" />

    <!-- Negative Space Cutouts & Intersecting Lines (Emergence Mechanism) -->
    <line x1="140" y1="210" x2="660" y2="210" stroke="#EFECE6" stroke-width="2" opacity="0.5"/>
    <circle cx="330" cy="210" r="16" fill="#EFECE6"/>
    <circle cx="480" cy="210" r="16" fill="#EFECE6"/>

    <!-- Base Typography (Outside Blocks) -->
    <text x="400" y="221" class="title-main" fill="#1C1E1B" text-anchor="middle">ALETHEIA</text>

    <!-- Clipped Typography (Inside Amethyst Block) -->
    <g clip-path="url(#clipLeft)">
      <text x="400" y="221" class="title-main" fill="#F7F5EF" text-anchor="middle">ALETHEIA</text>
    </g>

    <!-- Clipped Typography (Inside Gold Block) -->
    <g clip-path="url(#clipMid)">
      <text x="400" y="221" class="title-main" fill="#2E1C3B" text-anchor="middle">ALETHEIA</text>
    </g>

    <!-- Clipped Typography (Inside Sage Block) -->
    <g clip-path="url(#clipRight)">
      <text x="400" y="221" class="title-main" fill="#F7F5EF" text-anchor="middle">ALETHEIA</text>
    </g>
  </g>

  <!-- Subtitle & Motto -->
  <text x="400" y="380" class="title-main" font-size="14px" fill="#3B2348" letter-spacing="0.5em" text-anchor="middle">EMERGENCE</text>
  <text x="400" y="420" class="sub-thresh" text-anchor="middle">WHERE INTELLIGENCE CONVERGES, CREATION COALESCES</text>
</svg>
