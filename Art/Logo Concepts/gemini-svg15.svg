<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <style>
      .bg-crest { fill: #131215; }
      .brand-title-crest { font-family: 'Cinzel', 'Baskerville', serif; font-weight: 500; font-size: 25px; fill: #EBE6DC; letter-spacing: 0.36em; }
      .brand-sub-crest { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 10px; fill: #D4AF37; letter-spacing: 0.3em; }
    </style>

    <linearGradient id="purplePlane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A3369"/>
      <stop offset="100%" stop-color="#2D1736"/>
    </linearGradient>

    <linearGradient id="goldPlane" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#9A7422"/>
    </linearGradient>

    <linearGradient id="sagePlane" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E7063"/>
      <stop offset="100%" stop-color="#243830"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Field -->
  <rect class="bg-crest" width="800" height="520" />

  <!-- The Architectural Crest of Unconcealment -->
  <g transform="translate(400, 185)">
    <!-- Base Layer: Sage Shadow Plane -->
    <path d="M -80,40 C -80,-40 0,-100 0,-100 C 0,-100 80,-40 80,40 C 80,100 0,60 0,60 C 0,60 -80,100 -80,40 Z" fill="url(#sagePlane)" opacity="0.7" />

    <!-- Mid Layer: Amethyst Wing Plane -->
    <path d="M -95,-10 C -45,-80 0,-20 0,-20 C 0,-20 45,-80 95,-10 C 65,50 0,90 0,90 C 0,90 -65,50 -95,-10 Z" fill="url(#purplePlane)" opacity="0.9" />

    <!-- Top Layer: Gold Core Aperture Shield -->
    <path d="M -50,-20 C -20,-60 0,-10 0,-10 C 0,-10 20,-60 50,-20 C 35,30 0,55 0,55 C 0,55 -35,30 -50,-20 Z" fill="url(#goldPlane)" />

    <!-- Disclosed Focal Core (The Unconcealed Eye/Truth) -->
    <ellipse cx="0" cy="0" rx="14" ry="24" fill="#131215" />
    <ellipse cx="0" cy="0" rx="6" ry="12" fill="#EBE6DC" />
    <circle cx="0" cy="0" r="3" fill="#D4AF37" />
  </g>

  <!-- Integrated Classic Lockup -->
  <text x="400" y="355" class="brand-title-crest" text-anchor="middle">ALETHEIA EMERGENCE</text>
  <text x="400" y="390" class="brand-sub-crest" text-anchor="middle">WHERE INTELLIGENCE CONVERGES, CREATION COALESCES</text>
</svg>
