<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .bg-prism { fill: #1A1B1E; }
      .brand-title-prism { font-family: 'Cinzel', 'Baskerville', 'Georgia', serif; font-weight: 400; font-size: 25px; fill: #EBE8DF; letter-spacing: 0.38em; }
      .brand-subtitle-prism { font-family: 'Inter', -apple-system, sans-serif; font-weight: 300; font-size: 10px; fill: #B85C43; letter-spacing: 0.28em; }
      .prism-plane { fill: #EBE8DF; }
      .prism-accent { stroke: #B85C43; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg-prism" width="800" height="500" />

  <!-- Emblem: Architectural Planes & Negative Gap -->
  <g transform="translate(400, 185)">
    <!-- Upper Shifted Plane -->
    <polygon points="-75,-48 35,-48 15,-6 -95,-6" class="prism-plane" opacity="0.95"/>
    
    <!-- Lower Shifted Plane -->
    <polygon points="-15,6 95,6 75,48 -35,48" class="prism-plane" opacity="0.95"/>
    
    <!-- Terracotta Focal Slice -->
    <line class="prism-accent" x1="-80" y1="0" x2="80" y2="0" opacity="0.85"/>
    <circle cx="0" cy="0" r="3.5" fill="#B85C43"/>
  </g>

  <!-- Brand Typography -->
  <text x="400" y="335" class="brand-title-prism" text-anchor="middle">ALETHEIA EMERGENCE</text>
  <text x="400" y="370" class="brand-subtitle-prism" text-anchor="middle">WHERE INTELLIGENCE CONVERGES, CREATION COALESCES</text>
</svg>
