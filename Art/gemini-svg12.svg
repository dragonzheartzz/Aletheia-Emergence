<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <style>
      .bg-res { fill: #F4F1EA; }
      .title-res { font-family: 'Cinzel', 'Baskerville', 'Georgia', serif; font-weight: 500; font-size: 25px; fill: #1C1A1D; letter-spacing: 0.35em; }
      .sub-res { font-family: 'Inter', -apple-system, sans-serif; font-weight: 300; font-size: 10px; fill: #5A4E38; letter-spacing: 0.3em; }
      .wave-p { fill: none; stroke-linecap: round; opacity: 0.85; }
    </style>
    
    <linearGradient id="plumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E5D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#23122E" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8C6A15" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="mossGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D5A45" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1E3023" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="bg-res" width="800" height="520" />

  <!-- The Interactive Resonance Field -->
  <g transform="translate(400, 200)">
    <!-- Primary Field Waves: Origin A (Plum / Left Vector) -->
    <path class="wave-p" stroke="url(#plumGrad)" stroke-width="2" d="M -160,-80 C -80,-80 -40,-20 0,0 C 40,20 80,80 160,80" />
    <path class="wave-p" stroke="url(#plumGrad)" stroke-width="3.5" d="M -140,-100 C -70,-60 -30,-10 0,0 C 30,10 70,60 140,100" />
    <path class="wave-p" stroke="url(#plumGrad)" stroke-width="1.5" d="M -180,-60 C -90,-100 -50,-30 0,0 C 50,30 90,100 180,60" />

    <!-- Primary Field Waves: Origin B (Gold / Right Vector) -->
    <path class="wave-p" stroke="url(#goldGrad)" stroke-width="2" d="M 160,-80 C 80,-80 40,-20 0,0 C -40,20 -80,80 -160,80" />
    <path class="wave-p" stroke="url(#goldGrad)" stroke-width="3.5" d="M 140,-100 C 70,-60 30,-10 0,0 C -30,10 -70,60 -140,100" />
    <path class="wave-p" stroke="url(#goldGrad)" stroke-width="1.5" d="M 180,-60 C 90,-100 50,-30 0,0 C -50,30 -90,100 -180,60" />

    <!-- Vertical Grounding Waves: Origin C (Moss Sage / Deep Vector) -->
    <path class="wave-p" stroke="url(#mossGrad)" stroke-width="2.5" d="M -60,140 C -40,60 -10,20 0,0 C 10,-20 40,-60 60,-140" />
    <path class="wave-p" stroke="url(#mossGrad)" stroke-width="1.8" d="M 60,140 C 40,60 10,20 0,0 C -10,-20 -40,-60 -60,-140" />

    <!-- Emergent Interference Focal Lens -->
    <ellipse cx="0" cy="0" rx="38" ry="22" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="2 4" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="22" ry="38" fill="none" stroke="#4A2E5D" stroke-width="1" stroke-dasharray="2 4" opacity="0.7"/>
    <circle cx="0" cy="0" r="5" fill="#1C1A1D"/>
    <circle cx="0" cy="0" r="2" fill="#F4F1EA"/>
  </g>

  <!-- Integrated Identity Lockup -->
  <text x="400" y="365" class="title-res" text-anchor="middle">ALETHEIA EMERGENCE</text>
  <text x="400" y="400" class="sub-res" text-anchor="middle">WHERE INTELLIGENCE CONVERGES, CREATION COALESCES</text>
</svg>
